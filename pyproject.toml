[project]
name = "local-rag-chat"
version = "1.0.0"
description = "Chat with your local documents using RAG, Ollama and Streamlit - 100% offline."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Make `import backend` / `import frontend` work without installing the package.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "chroma_db"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend", "scripts"]
